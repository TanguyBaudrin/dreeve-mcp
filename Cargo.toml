[package]
name = "dreeve-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "MCP server exposing the self-hosted Dreeve activity platform over Streamable HTTP"
repository = "https://github.com/TanguyBaudrin/dreeve-mcp"
readme = "README.md"
keywords = ["mcp", "dreeve", "model-context-protocol"]
categories = ["command-line-utilities"]

[dependencies]
rmcp = { version = "3.6", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "fs",
] }
tokio-util = "0.7"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "multipart",
    "query",
    "rustls",
    "system-proxy",
] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
